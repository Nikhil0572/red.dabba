<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedDabba — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar-admin">
  <div>
    <h1>RedDabba — Admin</h1>
    <div class="sub" id="userLabel">Not logged in</div>
  </div>
  <button class="btn btn-outline-white" id="logoutBtn" style="display:none;width:auto;padding:8px 14px;font-size:13px;">Logout</button>
</div>

<div class="container" style="padding-top:20px;">

  <!-- LOGIN -->
  <div class="card" id="loginView">
    <h3 style="margin-top:0;color:var(--maroon);">Admin Login</h3>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="owner@reddabba.com">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Password">
    <div id="loginError" style="color:#c0392b;font-size:13px;margin:8px 0;"></div>
    <button class="btn btn-primary" id="loginBtn" style="margin-top:8px;">Login</button>
  </div>

  <!-- MAIN -->
  <div id="appView" style="display:none;">

    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num" id="statToday">0</div><div class="stat-label">आज के Orders</div></div>
      <div class="stat-box"><div class="stat-num" id="statPending">0</div><div class="stat-label">Pending</div></div>
      <div class="stat-box"><div class="stat-num" id="statRevenue">₹0</div><div class="stat-label">आज की कमाई</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="ordersTab">Orders</button>
      <button class="tab-btn" data-tab="menuTab">आज का Menu</button>
    </div>

    <!-- ORDERS TAB -->
    <div class="tab-content" id="ordersTab">
      <div class="card" style="padding:14px;">
        <select id="statusFilter" style="margin:0;">
          <option value="">सभी Orders</option>
          <option value="Placed">सिर्फ Placed</option>
          <option value="Preparing">सिर्फ Preparing</option>
          <option value="Out for Delivery">सिर्फ Out for Delivery</option>
          <option value="Delivered">सिर्फ Delivered</option>
        </select>
      </div>
      <div id="ordersList" class="loader">Loading orders...</div>
    </div>

    <!-- MENU TAB -->
    <div class="tab-content" id="menuTab" style="display:none;">
      <div class="card">
        <h3 style="margin-top:0;color:var(--maroon);font-size:15px;">आज की Thali सेट करें</h3>
        <label>Thali/Tiffin का नाम</label>
        <input type="text" id="menuName" placeholder="जैसे: आज की स्पेशल थाली">
        <label>Description (क्या-क्या है)</label>
        <textarea id="menuDesc" placeholder="जैसे: दाल, आलू-गोभी, चावल, 3 रोटी, अचार, पापड़"></textarea>
        <label>Price (₹)</label>
        <input type="number" id="menuPrice" value="49">
        <label style="display:flex;align-items:center;gap:8px;margin-top:14px;">
          <input type="checkbox" id="menuAvailable" style="width:auto;" checked>
          आज सेवा चालू है (Available for order)
        </label>
        <button class="btn btn-primary" id="saveMenuBtn" style="margin-top:14px;">Menu Save करें</button>
        <div id="menuSaveMsg" style="color:#1c7c3c;font-size:13px;margin-top:8px;"></div>
      </div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
