<!-- Baaki purana HTML head tag yahan rakhein -->
<body>

<div class="brand-hero">
  <!-- Same SVG background code -->
  <div class="brand-wordmark"><span class="word-red">Red</span><span class="word-dabba">Dabba</span></div>
  <div class="brand-tagline">₹49 में भरपेट थाली</div>
  <div class="brand-sub" style="color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 6px;">घर जैसा खाना • रोज़ ताज़ा • तुरंत डिलीवरी</div>
</div>

<div class="container">
  <div class="card menu-card" id="menuCard">
    <!-- Same SVG Menu Icon -->
    <div class="menu-info">
      <div class="menu-name" id="menuName">आज की थाली</div>
      <div class="menu-desc" id="menuDesc">Loading deliciousness...</div>
      <div class="menu-price" id="menuPrice">₹49</div>
    </div>
  </div>

  <div id="unavailableNotice" style="display:none;" class="card warn-note">
    माफ़ कीजिए, आज सेवा बंद है। कृपया कल दोबारा कोशिश करें।
  </div>

  <div class="card" id="orderCard">
    <div class="qty-row">
      <span class="qty-label" style="font-weight: 700; font-size: 15px; color: var(--maroon);">कितनी थाली चाहिए?</span>
      <div class="qty-stepper">
        <button class="qty-btn" id="qtyMinus">−</button>
        <span class="qty-value" id="qtyValue">1</span>
        <button class="qty-btn" id="qtyPlus">+</button>
      </div>
    </div>

    <label>आपका नाम</label>
    <input type="text" id="custName" placeholder="जैसे: Ramesh Kumar" autocomplete="name">

    <label>Phone Number</label>
    <input type="tel" id="custPhone" placeholder="98XXXXXXXX" maxlength="10" autocomplete="tel">

    <label>Delivery Address</label>
    <textarea id="custAddress" placeholder="पूरा पता लिखें (मकान नं, गली, लैंडमार्क)"></textarea>

    <label>कोई खास निर्देश? (optional)</label>
    <input type="text" id="custNote" placeholder="जैसे: कम तीखा, जल्दी चाहिए">

    <div class="total-row">
      <span class="total-label" style="font-size: 15px; font-weight: 600; color: var(--text-dim);">कुल राशि <br><small style="color: var(--red);">Cash on Delivery</small></span>
      <span class="total-value" id="totalValue">₹49</span>
    </div>

    <button class="btn btn-primary" id="placeOrderBtn">Order करें</button>
  </div>
</div>

<!-- Toast Notification Element -->
<div id="toast" class="toast">Message here</div>

<!-- Confirm overlay same rahega -->
